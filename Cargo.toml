[package]
name = "shun"
description = "Flow-driven payload delivery runtime — installers, flashers, and portable modes"
version = "0.6.32"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license-file = "LICENSE"
repository = "https://github.com/celestia-island/shun"
readme = "README.md"
keywords = ["installer", "packager", "portable", "deploy", "flasher"]
categories = ["development-tools"]
publish = true
exclude = ["docs/", "scripts/", ".github/", "assets/", "justfile", "rust-toolchain.toml"]

[dependencies]
# Script runner interpreters (feature `scripting`, default on). Optional
# so embedded consumers (default-features = false) do not drag the
# scripting runtime — and its transitive zip/ftp tree — into their
# dependency graph at all.
duckscript = { version = "0.10.0", optional = true }
duckscriptsdk = { version = "0.11.1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tar.workspace = true
zstd.workspace = true
sha2.workspace = true
walkdir.workspace = true
# `json` enables `Request::send_json` (the pairing gateway client posts
# JSON-RPC bodies).
ureq = { version = "^2", optional = true, features = ["json"] }
clap = { version = "^4", features = ["derive"], optional = true }
image = { version = "^0.25", default-features = false, features = ["ico", "png", "webp"], optional = true }
# Interpreter probe (optional, `python-probe`): links the build host's
# CPython — `auto-initialize` embeds it into the process. Never in the
# default build; see docs/en/design/scripting.md.
pyo3 = { version = "^0.23", optional = true, features = ["auto-initialize"] }

[features]
default = ["online", "cli", "scripting"]
online = ["dep:ureq"]
# The embedded script runners (duckscript) behind manifest script
# hooks — see docs/en/design/scripting.md. Default on (the CLI and
# the shell build with it); embedded consumers building
# default-features = false stay lean, and a manifest that still
# declares hooks fails loudly instead of silently skipping them.
scripting = ["dep:duckscript", "dep:duckscriptsdk"]
# The `shun` CLI binary: artifact builder, packer, icon tooling, signing.
cli = ["dep:clap", "dep:image", "online"]
# Embedding probe for the optional Python runtime (design note:
# docs/en/design/scripting.md). Opt-in so the default build — and CI —
# never link an interpreter.
python-probe = ["dep:pyo3"]

[target.'cfg(unix)'.dependencies]
libc = "^0.2"

[target.'cfg(windows)'.dependencies]
winreg = "^0.56"
mslnk = "^0.1.8"
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Foundation",
] }
# The Shell COM interfaces (IShellLink/IPersistFile/IPropertyStore) only
# exist in the `windows` crate — windows-sys ships functions, not these
# interface types. Used for the AUMID stamp (src/targets/aumid.rs).
windows = { version = "^0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
] }

[[bin]]
name = "shun"
path = "src/bin/shun.rs"
required-features = ["cli"]

# Embedded-Python runner probe (design note: docs/en/design/scripting.md).
[[example]]
name = "pyembed_runner"
required-features = ["python-probe"]

[dev-dependencies]
tempfile = "^3"

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["shell", "demo-app"]

[workspace.package]
version = "0.6.32"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]

[workspace.dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
tar = "^0.4"
toml = "^0.9"
zstd = { version = "^0.13", features = ["zstdmt"] }
sha2 = "^0.10"
walkdir = "^2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "thin"
