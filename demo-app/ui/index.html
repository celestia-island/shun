<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShunDemo</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2c;
        --panel-edge: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --accent-soft: rgba(34, 211, 238, 0.14);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        background: linear-gradient(160deg, var(--bg) 0%, #0f172a 100%);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 28px;
        user-select: none;
      }
      header { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      header img { width: 96px; height: 96px; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      .chips { display: flex; gap: 8px; }
      .chip {
        font-size: 12px;
        padding: 3px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(34, 211, 238, 0.35);
      }
      .chip.placeholder { color: var(--muted); border-color: var(--panel-edge); background: rgba(30, 41, 59, 0.5); }
      main {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; }
      .row .k { color: var(--muted); white-space: nowrap; }
      .row .v { text-align: right; word-break: break-all; }
      footer { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
      footer a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <img src="logo.webp" alt="ShunDemo" draggable="false" />
      <h1>ShunDemo</h1>
      <div class="chips">
        <span class="chip placeholder" id="chip-mode">…</span>
        <span class="chip placeholder" id="chip-version">…</span>
      </div>
    </header>
    <main>
      <div class="row"><span class="k">投递模式</span><span class="v" id="mode">检测中…</span></div>
      <div class="row"><span class="k">安装位置</span><span class="v" id="root">检测中…</span></div>
      <div class="row"><span class="k">运行时</span><span class="v">Tauri 2 · WebView2</span></div>
    </main>
    <footer>
      此应用由 shun 投递流程完成安装。<br />
      <a href="https://github.com/celestia-island/shun">celestia-island/shun</a>
    </footer>
    <script>
      const invoke = (cmd) =>
        window.__TAURI__?.core?.invoke?.(cmd) ?? Promise.reject(new Error("no ipc"));
      const fill = (id, value) => {
        document.getElementById(id).textContent = value;
      };
      invoke("delivery_mode")
        .then((mode) => {
          fill("mode", mode === "portable" ? "便携模式（免注册表）" : "本机安装（含注册项）");
          const chip = document.getElementById("chip-mode");
          chip.textContent = mode === "portable" ? "portable" : "local";
          chip.classList.remove("placeholder");
        })
        .catch(() => fill("mode", "未知"));
      invoke("install_root").then((root) => fill("root", root)).catch(() => fill("root", "未知"));
      invoke("app_version")
        .then((version) => {
          const chip = document.getElementById("chip-version");
          chip.textContent = "v" + version;
          chip.classList.remove("placeholder");
        })
        .catch(() => {});
    </script>
  </body>
</html>
