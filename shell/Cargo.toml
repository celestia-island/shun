[package]
name = "shun_demo_shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../LICENSE"
publish = false # demo shell for the shun runtime, never published
description = "Shun demo shell — hikari UI over the shun install flow"

[[bin]]
name = "shun-demo-shell"
path = "src/main.rs"

[build-dependencies]
shun = { path = ".." }
tauri-build = "^2"
serde_json = "^1"

[dependencies]
eframe = "0.32.3"
egui = "0.32.3"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.17.2"
serde.workspace = true
serde_json = "^1"
shun = { path = ".." }

# Direct (non-workspace) deps — a demo shell should build lean.
tauri = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
] }
winreg = "0.56.0"

# The shell carries no `[package.metadata.shun]` of its own: the delivery
# manifest it embeds comes from the target application (SHUN_MANIFEST, or
# the sibling demo-app crate by default — see build.rs). One product, one
# manifest.
