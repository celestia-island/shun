name: Checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: fmt + check + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            full: "false"
          - os: windows-latest
            full: "true"
        rust: [stable]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index/
            ${{ env.CARGO_HOME }}/registry/cache/
            ${{ env.CARGO_HOME }}/git/db/
            target
          key: ${{ matrix.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.rust }}-cargo-
            ${{ matrix.os }}-cargo-

      - name: Build shell frontend
        if: runner.os == 'Windows'
        working-directory: shell/web
        run: |
          npm install -g pnpm@11
          pnpm install
          pnpm build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --workspace --all-targets ${{ matrix.full == 'true' && '--all-features' || '' }}

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets ${{ matrix.full == 'true' && '--all-features' || '' }} -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace ${{ matrix.full == 'true' && '--all-features' || '' }}
