[package]
name = "shun"
description = "Flow-driven payload delivery runtime — installers, flashers, and portable modes"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license-file = "LICENSE"
repository = "https://github.com/celestia-island/shun"
readme = "README.md"
keywords = ["installer", "packager", "portable", "deploy", "flasher"]
categories = ["development-tools"]
publish = true
exclude = ["docs/", "scripts/", ".github/", "assets/", "justfile", "rust-toolchain.toml"]

[dependencies]
serde = { version = "^1", features = ["derive"] }
thiserror = "^2"

[dev-dependencies]
serde_json = "^1"

[lints]
workspace = true

[workspace]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
lto = "thin"
