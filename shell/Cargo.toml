[package]
name = "shun_installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../LICENSE"
publish = false # demo shell for the shun runtime, never published
description = "Shun installer shell — hikari UI over the shun install flow"

[[bin]]
name = "shun-installer"
path = "src/main.rs"

[build-dependencies]
base64 = "^0.22"
shun = { path = ".." }
tauri-build = "^2"
serde_json = "^1"
# The exe-resource ICO is generated from the manifest's product logo at
# build time (see build.rs `write_logo_ico`) — decode the source logo,
# encode the multi-size ICO.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "ico"] }

[dependencies]
# Argument face + the TUI renderer.
clap = { version = "^4", features = ["derive"] }
ratatui = "^0.29"
crossterm = "^0.28"
eframe = "0.32.3"
egui = "0.32.3"
# HWND access for the DWM corner/shadow hint (the frame's own handle).
raw-window-handle = "0.6"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
# Lucide caption icons: the same icon set the webview face imports
# (lucide-vue-next) — the egui face rasterizes the identical SVG path
# data instead of hand-drawn lookalikes.
resvg = "0.45"
rfd = "0.17.2"
serde.workspace = true
serde_json = "^1"
base64 = "^0.22"
shun = { path = ".." }

# Direct (non-workspace) deps — a demo shell should build lean.
tauri = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
  "Win32_System_Console",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Time",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
] }
# The solar theme clock's location fix — the native slot for hikari's
# geolocation provider (windows-sys ships no WinRT, only the `windows`
# crate does).
windows = { version = "^0.61", features = [
  "Devices_Geolocation",
  "Foundation",
] }
winreg = "0.56.0"

# The shell carries no `[package.metadata.shun]` of its own: the delivery
# manifest it embeds comes from the target application (SHUN_MANIFEST, or
# the sibling demo-app crate by default — see build.rs). One product, one
# manifest.
