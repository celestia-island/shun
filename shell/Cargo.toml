[package]
name = "shun_demo_shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file = "../LICENSE"
publish = false # demo shell for the shun runtime, never published
description = "Shun demo shell — hikari UI over the shun install flow"

[[bin]]
name = "shun-demo-shell"
path = "src/main.rs"

[build-dependencies]
shun = { path = ".." }
tauri-build = "^2"
serde_json = "^1"

[dependencies]
serde.workspace = true
serde_json = "^1"
shun = { path = ".." }

# Direct (non-workspace) deps — a demo shell should build lean.
tauri = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ── shun delivery manifest ─────────────────────────────────────────────
# The demo install flow is generated from this table: product identity
# defaults to [package], everything here customizes the delivery. See
# shun::config::ShunConfig::from_cargo_manifest.
[package.metadata.shun]
product = "ShunDemo"
publisher = "celestia-island"
logo = "docs/logo.webp"
payload = "../examples/demo_payload"
main-exe = "bin/shun-demo.cmd"

[package.metadata.shun.install]
local = true
portable = true

[package.metadata.shun.msix]
identity-name = "ShunDemo"
publisher = "CN=celestia-island"
display-name = "ShunDemo"
description = "Shun delivery demo"
executable = "bin/shun-demo.exe"

[package.metadata.shun.webview2]
type = "skip"
