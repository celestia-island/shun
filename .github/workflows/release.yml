name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  build-windows:
    # The GENERIC installer shell: a product-neutral build whose
    # placeholder embeds are replaced at stamp time (`shun build --shell`
    # appends the product's manifest container and patches the Windows
    # identity). Published raw + sha256 sidecar so consumer release jobs
    # download ONE warm artifact instead of compiling the whole
    # tauri+egui shell tree on every release of their own.
    name: Windows installer shell (generic, stamp-ready)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-shell-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-shell-

      # The committed shell/web/dist satisfies tauri-build's frontendDist
      # — no node toolchain on this lane (the tracked dist is the same
      # artifact local builds embed).
      - name: Build the generic shell
        env:
          SHUN_SHELL_PRESET: generic
        run: cargo build --release -p shun_installer

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\shun-installer.exe dist\shun-installer-windows-x64.exe
          $sha = (Get-FileHash dist\shun-installer-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$sha  shun-installer-windows-x64.exe" | Out-File -Encoding ascii dist\shun-installer-windows-x64.exe.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shun-installer-windows-x64.exe
            dist/shun-installer-windows-x64.exe.sha256

  build-linux:
    name: Linux demo binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # --all-features compiles the python-probe (pyo3): the runner's
      # default Python (3.14) is newer than pyo3 0.23 supports — pin the
      # interpreter to the supported line.
      - uses: actions/setup-python@v5

      # The workspace test pass compiles the Tauri shell, whose
      # generate_context! needs the built frontend beside it (the dist
      # is not tracked in git).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Build shell frontend
        working-directory: shell/web
        run: |
          pnpm install
          pnpm build

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build examples
        run: cargo build --release --examples

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/examples/demo_install dist/shun-demo-install-linux-x86_64
          cp target/release/examples/demo_flash dist/shun-demo-flash-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shun-demo-install-linux-x86_64
            dist/shun-demo-flash-linux-x86_64

  release-notes:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: celestia-island/celestia-devtools/.github/workflows/release-notes.yml@2e76d373762dc6b36c1ab7625c1c34842c28ad4a
    with:
      devtools-ref: 2e76d373762dc6b36c1ab7625c1c34842c28ad4a
